<style>
:root{--g:#73E639;--tx:#F4F6F2;--mut:#9aa097;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;color:var(--tx);font-family:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;min-height:100vh;background:radial-gradient(60% 50% at 15% 10%,rgba(115,230,57,.25),transparent 70%),linear-gradient(160deg,#262626,#151515) fixed;overflow-x:hidden}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03));-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.14);border-radius:28px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),0 20px 50px -20px rgba(0,0,0,.7)}
.tap{transition:transform .2s cubic-bezier(.34,1.56,.64,1)}.tap:active{transform:scale(.94)}
.btn{background:var(--g);color:#0d1a04;font-weight:700;border-radius:18px;padding:.65rem 1.1rem;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 8px 24px -8px rgba(115,230,57,.7);display:inline-flex;align-items:center;gap:.5rem;justify-content:center}
.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--tx);border-radius:16px;padding:.5rem .85rem;display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem}
.inp{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:.7rem 1rem;color:var(--tx);outline:none;font:inherit}
.inp:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(115,230,57,.22)}
.sw{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:background .3s;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.sw.on{background:var(--g)}.sw.on i{transform:translateX(20px)}
.fade{animation:f .45s cubic-bezier(.22,1,.36,1) both}@keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.nav{overflow-x:auto;scrollbar-width:none}
html{-webkit-text-size-adjust:100%}*{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}
body{min-height:100dvh}.glass{overflow-wrap:anywhere}
@media (hover:none){.lift:hover{transform:none}}
@media (max-width:640px){.glass{border-radius:24px}.btn{padding:.75rem 1rem}.ghost{padding:.6rem .8rem}.inp{padding:.8rem .95rem}}
@media (pointer:coarse){.ghost,.btn{min-height:44px}}

<script>
const {useState,useEffect,useRef}=React;const html=htm.bind(React.createElement);
const DEF={"maps": [{"id": 1, "nome": "Mirage", "tipo": "Granadas", "link": "https://steamcommunity.com/workshop/browse/?appid=730", "desc": "Smokes, molotovs e flashes para execuções A e B. Lineups marcados no chão.", "on": true}, {"id": 2, "nome": "Aim_Botz", "tipo": "Aim/Mira", "link": "https://steamcommunity.com/workshop/browse/?appid=730", "desc": "Bots configuráveis para treino de spray control e flicks a diferentes distâncias.", "on": true}, {"id": 3, "nome": "Inferno", "tipo": "Retake", "link": "https://steamcommunity.com/workshop/browse/?appid=730", "desc": "Cenários de retake 3v4 nos bombsites A e B com utilitário limitado.", "on": true}, {"id": 4, "nome": "Dust2", "tipo": "Posicionamento", "link": "https://steamcommunity.com/workshop/browse/?appid=730", "desc": "Ângulos, off-angles e posições de hold para CT e T.", "on": false}], "accounts": {"konkelfwt": {"pass": "konkelFWT2026", "admin": true, "disp": "Konkel", "steam": "https://steamcommunity.com/id/konkelfwt/", "email": "", "phone": ""}, "fergod99fwt": {"pass": "fergod991", "disp": "FerGod", "steam": "https://steamcommunity.com/profiles/76561199682614793", "email": "", "phone": ""}, "leodobigodefwt": {"pass": "bigode123", "disp": "Leo do Bigode", "steam": "https://steamcommunity.com", "email": "", "phone": ""}, "oliveirexfwt": {"pass": "oliveirafwt", "disp": "Oliveirex", "steam": "https://steamcommunity.com", "email": "", "phone": ""}, "oleofwt": {"pass": "manuoleofwt", "disp": "Oleo", "steam": "https://steamcommunity.com/profiles/76561199871391790", "email": "", "phone": ""}, "pixkitofwt": {"pass": "pixkofwt", "disp": "Pixkito", "steam": "https://steamcommunity.com/id/pixkito", "email": "", "phone": ""}}, "roster": ["konkelfwt", "fergod99fwt", "leodobigodefwt", "oleofwt", "pixkitofwt"], "links": {"discord": "https://discord.gg/NgYBeKcKzn", "steam": "https://steamcommunity.com/groups/fullwteam", "gname": "FULL W TEAM | FWT"}, "news": "", "site": {"name": "FULL W TEAM", "sub": "Escolhe uma rotina e treina com a equipa.", "login": "Inicia sessão para continuar", "footer": ""}, "menu": [{"id": "hub", "label": "Hub de Treino", "icon": "map", "on": true, "kind": "builtin"}, {"id": "opt", "label": "Otimização CS2", "icon": "zap", "on": true, "kind": "builtin"}, {"id": "roster", "label": "Roster", "icon": "users", "on": true, "kind": "builtin"}, {"id": "discord", "label": "Discord", "icon": "msg", "on": true, "kind": "builtin"}, {"id": "steam", "label": "Steam Group", "icon": "shield", "on": true, "kind": "builtin"}]};const KEY="fwt-admin-cfg";const M="var(--mut)";

const I=({n,s=16})=>html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d=${P[n]}/></svg>`;
const Logo=({s=34})=>html`<svg width=${s} height=${s*.847} viewBox="148 164 203 172" fill="#73E639"><polygon points="148,164 197,188 197,262 246,213 246,288 197,336 148,312"/><polygon points="351,164 302,188 302,262 253,213 253,288 302,336 351,312"/></svg>`;
const F=(l,v,f,o={})=>html`<label class="block"><span class="text-xs font-semibold px-1" style=${{color:M}}>${l}</span><input class="inp mt-1" value=${v||""} onInput=${e=>f(e.target.value)} ...${o}/></label>`;
const load=()=>{try{return {...DEF,...(JSON.parse(localStorage.getItem(KEY))||{})}}catch(e){return DEF}};

const LKEY="fwt-admin-login";
const hs=s=>{let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return x};
const GK="fwt-gh";
const GD={owner:"",repo:"",branch:"main",path:"config.json",token:"",auto:true,link:""};
const ghLoad=()=>{try{return {...GD,...JSON.parse(localStorage.getItem(GK))}}catch(e){return GD}};
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const parseRepo=s=>{s=(s||"").trim();let m=s.match(/github\.com\/([^\/\s]+)\/([^\/\s#?]+)/i);if(m)return{owner:m[1],repo:m[2].replace(/\.git$/,"")};m=s.match(/([^\/\s.]+)\.github\.io\/([^\/\s#?]+)/i);if(m)return{owner:m[1],repo:m[2]};return null};
async function ghGet(g){
 const u="https://api.github.com/repos/"+g.owner.trim()+"/"+g.repo.trim()+"/contents/"+g.path.trim().replace(/^\/+/,"");
 const r=await fetch(u+"?ref="+encodeURIComponent(g.branch.trim()),{headers:{Authorization:"Bearer "+g.token.trim(),Accept:"application/vnd.github+json"},cache:"no-store"});
 if(!r.ok)throw new Error(r.status===401?"Token inválido ou expirado.":r.status===404?"Ficheiro ou repositório não encontrado.":"Erro "+r.status+" ao ler o site.");
 const j=await r.json();return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))))}
async function ghPut(g,txt){
 const u="https://api.github.com/repos/"+g.owner.trim()+"/"+g.repo.trim()+"/contents/"+g.path.trim().replace(/^\/+/,"");
 const H={Authorization:"Bearer "+g.token.trim(),Accept:"application/vnd.github+json"};
 for(let i=0;i<2;i++){
  let sha;const r=await fetch(u+"?ref="+encodeURIComponent(g.branch.trim()),{headers:H,cache:"no-store"});
  if(r.ok)sha=(await r.json()).sha;else if(r.status!==404)throw new Error(r.status===401?"Token inválido ou expirado.":r.status===403?"Sem permissão: o token precisa de Contents: Read and write.":"Erro "+r.status+" ao ler o repositório.");
  const w=await fetch(u,{method:"PUT",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({message:"Atualização via FWT Admin",content:b64(txt),branch:g.branch.trim(),...(sha?{sha}:{})})});
  if(w.ok)return;
  if(w.status===404)throw new Error("Repositório, branch ou token não encontrados.");
  if(w.status!==409&&w.status!==422)throw new Error("Erro "+w.status+" ao gravar.");
 }
 throw new Error("Conflito ao gravar. Tenta de novo.");
}
function Gate({accts,onOk}){
 const [u,setU]=useState("");const [p,setP]=useState("");const [e,setE]=useState(false);const [rm,setRm]=useState(false);
 const go=()=>{const k=u.trim().toLowerCase(),a=accts[k];if(a&&a.admin&&a.pass===p){try{rm?localStorage.setItem(LKEY,JSON.stringify({u:k,h:hs(p)})):localStorage.removeItem(LKEY)}catch(x){}onOk()}else setE(true)};
 return html`<div class="min-h-screen flex items-center justify-center p-5"><div class="glass fade w-full max-w-sm p-8 space-y-3">
  <div class="flex flex-col items-center mb-3"><${Logo} s=${52}/><h1 class="text-2xl font-extrabold mt-3">FWT Admin</h1><p class="text-sm" style=${{color:M}}>Consola de gestão</p></div>
  <input class="inp" placeholder="Utilizador admin" autocapitalize="none" value=${u} onInput=${x=>{setU(x.target.value);setE(false)}}/>
  <input class="inp" type="password" placeholder="Palavra-passe" value=${p} onInput=${x=>{setP(x.target.value);setE(false)}} onKeyDown=${x=>x.key==="Enter"&&go()}/>
  ${e&&html`<p class="text-sm text-red-400 px-1">Credenciais de admin incorretas.</p>`}
  <div role="switch" aria-checked=${rm} class="flex items-center justify-between px-1 cursor-pointer select-none" onClick=${()=>setRm(!rm)}><span class="text-sm">Memorizar login e palavra-passe</span><div class=${"sw "+(rm?"on":"")}><i></i></div></div>
  <button class="btn tap w-full" onClick=${go}><${I} n="lock"/> Entrar</button></div></div>`;
}

  <button class="btn tap" onClick=${()=>setC({...c,maps:[...c.maps,{id:Date.now(),nome:"Novo mapa",tipo:TYPES[0],link:"",desc:"",on:false}]})}><${I} n="plus"/> Novo mapa</button></div>

   <div class="flex items-center justify-between"><div class="flex items-center gap-3"><button class=${"sw tap "+(m.on?"on":"")} aria-label="Visível" onClick=${()=>up(i,{on:!m.on})}><i></i></button><span class="text-sm" style=${{color:M}}>${m.on?"Visível no app":"Oculto"}</span></div>
   <button class="ghost tap" style=${{color:"#f87171"}} onClick=${()=>setC({...c,maps:c.maps.filter((_,j)=>j!==i)})}><${I} n="trash"/> Remover</button></div></div>`)}</div>`;
}

function Uname({k,ren}){
 const [v,setV]=useState(k);const [e,setE]=useState("");useEffect(()=>setV(k),[k]);
 const ok=()=>{const r=ren(k,v);if(r){setE(r);setV(k)}else setE("")};
 return html`<div>${F("Nome de utilizador (login)",v,x=>{setV(x);setE("")},{onBlur:ok,onKeyDown:ev=>ev.key==="Enter"&&ev.target.blur(),autocapitalize:"none"})}${e&&html`<p class="text-xs text-red-400 px-1 mt-1">${e}</p>`}</div>`}
function Accts({c,setC}){
 const [nu,setNu]=useState("");const nAdm=Object.values(c.accounts).filter(x=>x.admin).length;
 const ren=(o,v)=>{const n=v.trim().toLowerCase().replace(/\s+/g,"");if(!n)return"O nome não pode ficar vazio.";if(n===o)return null;if(c.accounts[n])return"Esse utilizador já existe.";
  setC({...c,accounts:Object.fromEntries(Object.entries(c.accounts).map(([k,a])=>[k===o?n:k,a])),roster:c.roster.map(k=>k===o?n:k)});return null};
 const up=(k,p)=>setC({...c,accounts:{...c.accounts,[k]:{...c.accounts[k],...p}}});
 const rost=k=>setC({...c,roster:c.roster.includes(k)?c.roster.filter(x=>x!==k):[...c.roster,k]});
 const del=k=>{const a={...c.accounts};delete a[k];setC({...c,accounts:a,roster:c.roster.filter(x=>x!==k)})};
 const add=()=>{const k=nu.trim().toLowerCase().replace(/\s+/g,"");if(!k||c.accounts[k])return;setC({...c,accounts:{...c.accounts,[k]:{pass:"mudar123",disp:nu.trim(),steam:"https://steamcommunity.com",email:"",phone:""}}});setNu("")};
 return html`<div class="space-y-4 fade"><h2 class="font-bold text-xl">Contas e Roster</h2>
  <div class="flex gap-2"><input class="inp" placeholder="novo utilizador (ex: joaofwt)" value=${nu} onInput=${e=>setNu(e.target.value)}/><button class="btn tap" onClick=${add}><${I} n="plus"/> Criar</button></div>
  ${Object.keys(c.accounts).map(k=>{const a=c.accounts[k];return html`<div key=${k} class="glass p-5 space-y-3" style=${{borderRadius:24}}>
   <div class="flex items-center justify-between"><b style=${{color:"var(--g)"}}>@${k}</b>${!(a.admin&&nAdm===1)&&html`<button class="ghost tap" style=${{color:"#f87171"}} onClick=${()=>del(k)}><${I} n="trash"/> Remover</button>`}</div>
   <div class="grid gap-3 sm:grid-cols-2"><${Uname} k=${k} ren=${ren}/>${F("Nome de exibição",a.disp,v=>up(k,{disp:v}))}${F("Password",a.pass,v=>up(k,{pass:v}))}${F("Link Steam",a.steam,v=>up(k,{steam:v}))}</div>
   <div class="flex gap-5 text-sm flex-wrap"><label class="flex items-center gap-2"><input type="checkbox" checked=${!!a.admin} disabled=${!!a.admin&&nAdm===1} onChange=${e=>up(k,{admin:e.target.checked})}/> Admin</label><label class="flex items-center gap-2"><input type="checkbox" checked=${c.roster.includes(k)} onChange=${()=>rost(k)}/> Aparece no Roster</label></div></div>`})}</div>`;
}

const ICONS=[["shield","Escudo"],["link","Ligação"],["msg","Mensagem"],["users","Equipa"],["zap","Raio"],["map","Mapa"],["user","Pessoa"],["ext","Externo"]];
function MenuTab({c,setC}){
 const m=c.menu,site=c.site,on=m.filter(x=>x.on).length;
 const setM=a=>setC({...c,menu:a});const up=(i,p)=>setM(m.map((x,j)=>j===i?{...x,...p}:x));
 const mv=(i,d)=>{const j=i+d;if(j<0||j>=m.length)return;const a=[...m];[a[i],a[j]]=[a[j],a[i]];setM(a)};
 const S=k=>v=>setC({...c,site:{...site,[k]:v}});
 const T=(x)=>x.kind==="builtin"?"Padrão":x.kind==="page"?"Página":"Link";
 return html`<div class="space-y-4 fade"><div class="glass p-6 space-y-3"><h2 class="font-bold text-xl">Site</h2>
  ${F("Nome da equipa / site",site.name,S("name"))}${F("Subtítulo do Hub",site.sub,S("sub"))}${F("Texto do login",site.login,S("login"))}${F("Rodapé (vazio = escondido)",site.footer,S("footer"))}</div>
  <div class="flex items-center justify-between gap-2 flex-wrap"><h2 class="font-bold text-xl">Menu do site (${m.length})</h2><div class="flex gap-2">
   <button class="btn tap" onClick=${()=>setM([...m,{id:"c"+Date.now(),kind:"page",label:"Nova página",icon:"shield",on:true,title:"",text:"",btnLabel:"",btnUrl:""}])}><${I} n="plus"/> Página</button>
   <button class="ghost tap" onClick=${()=>setM([...m,{id:"c"+Date.now(),kind:"link",label:"Novo link",icon:"link",on:true,url:"https://"}])}><${I} n="plus"/> Link</button></div></div>
  ${m.map((x,i)=>html`<div key=${x.id} class="glass p-5 space-y-3" style=${{borderRadius:24}}>
   <div class="flex items-center gap-2 flex-wrap"><span class="text-xs font-bold px-2 py-1 rounded-full" style=${{background:"rgba(255,255,255,.1)",color:x.kind==="builtin"?M:"var(--g)"}}>${T(x)}</span><div class="flex-1"></div>
    <button class="ghost tap" aria-label="Subir" disabled=${i===0} onClick=${()=>mv(i,-1)}>▲</button><button class="ghost tap" aria-label="Descer" disabled=${i===m.length-1} onClick=${()=>mv(i,1)}>▼</button>

   <div class="grid gap-3 sm:grid-cols-2">${F("Nome no menu",x.label,v=>up(i,{label:v}))}
    ${x.kind!=="builtin"&&html`<label class="block"><span class="text-xs font-semibold px-1" style=${{color:M}}>Ícone</span><select class="inp mt-1" value=${x.icon} onChange=${e=>up(i,{icon:e.target.value})}>${ICONS.map(([v,l])=>html`<option key=${v} value=${v} style=${{background:"#1E1E1E"}}>${l}</option>`)}</select></label>`}</div>
   ${x.kind==="link"&&F("Endereço (abre noutro separador)",x.url,v=>up(i,{url:v}))}
   ${x.kind==="page"&&html`<div class="space-y-3">${F("Título da página",x.title,v=>up(i,{title:v}))}<textarea class="inp" rows="4" placeholder="Texto da página" value=${x.text} onInput=${e=>up(i,{text:e.target.value})}></textarea>
    <div class="grid gap-3 sm:grid-cols-2">${F("Texto do botão (opcional)",x.btnLabel,v=>up(i,{btnLabel:v}))}${F("Link do botão (opcional)",x.btnUrl,v=>up(i,{btnUrl:v}))}</div></div>`}</div>`)}</div>`;
}
function Links({c,setC}){

  <label class="block"><span class="text-xs font-semibold px-1" style=${{color:M}}>Anúncio no Hub (vazio = escondido)</span><textarea class="inp mt-1" rows="3" value=${c.news} onInput=${e=>setC({...c,news:e.target.value})}></textarea></label></div>`;

function Publish({c,setC,gh}){
 const {g,setG,st,pub,pull}=gh;const lk=g.link||(g.owner&&g.repo?"https://github.com/"+g.owner+"/"+g.repo:"");const ready=!!(g.owner&&g.repo&&g.token);const S=k=>v=>setG({...g,[k]:v});
 const txt=JSON.stringify(c,null,2);const [imp,setImp]=useState("");const [msg,setMsg]=useState("");const [rs,setRs]=useState(false);
 const say=m=>{setMsg(m);setTimeout(()=>setMsg(""),2500)};
 const cp=async()=>{try{await navigator.clipboard.writeText(txt)}catch(e){const o=document.getElementById("out");o.select();document.execCommand("copy")}say("Copiado!")};
 const dl=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download="config.json";a.click();say("A descarregar config.json…")};
 const ap=()=>{try{const j=JSON.parse(imp);if(!j.maps||!j.accounts)throw 0;setC({...DEF,...j});setImp("");say("Configuração importada.")}catch(e){say("JSON inválido.")}};
 return html`<div class="space-y-4 fade"><div class="glass p-6 space-y-3"><div class="flex items-center justify-between gap-3"><h2 class="font-bold text-xl">Publicação automática</h2><span class="text-xs font-bold px-3 py-1 rounded-full" style=${{background:ready&&g.auto?"rgba(115,230,57,.18)":"rgba(255,255,255,.1)",color:ready&&g.auto?"var(--g)":M}}>${ready?(g.auto?"Ligada":"Desligada"):"Por configurar"}</span></div>
  <p class="text-sm" style=${{color:M}}>Cola o link do repositório e o token uma só vez. Depois, tudo o que alterares no painel é enviado ao site sozinho e fica online em cerca de 1 minuto.</p>
  ${F("Link do repositório ou do site (GitHub)",lk,v=>{const r=parseRepo(v);setG({...g,link:v,...(r||{})})},{placeholder:"https://github.com/utilizador/fwtsite"})}
  ${F("Token do GitHub (Contents: Read and write)",g.token,S("token"),{type:"password",autocomplete:"off"})}
  <div class="flex items-center gap-3 cursor-pointer select-none" onClick=${()=>setG({...g,auto:!g.auto})}><div class=${"sw "+(g.auto?"on":"")}><i></i></div><span class="text-sm">Atualizar o site automaticamente</span></div>
  <div class="flex gap-2 items-center flex-wrap"><button class="btn tap" disabled=${st.s==="run"} onClick=${pub}><${I} n="check"/> Publicar agora</button><button class="ghost tap" disabled=${!ready||st.s==="run"} onClick=${pull}><${I} n="dl"/> Carregar config do site</button>${st.s!=="idle"&&html`<span class="text-sm" style=${{color:st.s==="err"?"#f87171":"var(--g)"}}>${st.m}</span>`}</div>
  <details class="text-sm" style=${{color:M}}><summary class="cursor-pointer">Avançado</summary><div class="grid gap-3 sm:grid-cols-2 mt-3">${F("Branch",g.branch,S("branch"))}${F("Ficheiro no repositório",g.path,S("path"))}</div></details>
  <p class="text-xs" style=${{color:M}}>O token fica só neste dispositivo e nunca vai para o config.json. Abre o painel a partir do ficheiro do zip: a página do Claude bloqueia ligações à internet.</p></div>
  <div class="glass p-6 space-y-3"><h2 class="font-bold text-xl">Publicar manualmente (alternativa)</h2>
  <ol class="list-decimal pl-5 text-sm space-y-1" style=${{color:M}}><li>Faz as alterações nas outras abas (ficam guardadas neste dispositivo).</li><li>Descarrega ou copia o <b>config.json</b> abaixo.</li><li>Substitui o config.json da app no alojamento (ex.: Netlify → arrasta a pasta de novo).</li><li>Quem tiver a app aberta recebe o aviso "Nova versão disponível".</li></ol>
  <div class="flex gap-2 flex-wrap"><button class="btn tap" onClick=${dl}><${I} n="dl"/> Descarregar config.json</button><button class="ghost tap" onClick=${cp}><${I} n="copy"/> Copiar</button>${msg&&html`<span class="text-sm self-center" style=${{color:"var(--g)"}}>${msg}</span>`}</div>
  <textarea id="out" readonly class="inp" rows="9" style=${{fontFamily:"monospace",fontSize:12}} value=${txt}></textarea></div>
  <div class="glass p-6 space-y-3"><h3 class="font-bold">Importar config.json</h3><textarea class="inp" rows="4" placeholder="Cola aqui o conteúdo de um config.json" value=${imp} onInput=${e=>setImp(e.target.value)}></textarea>
  <div class="flex gap-2"><button class="ghost tap" onClick=${ap}><${I} n="check"/> Aplicar</button><button class="ghost tap" style=${{color:"#f87171"}} onClick=${()=>{if(rs){setC(DEF);setRs(false)}else{setRs(true);setTimeout(()=>setRs(false),3000)}}}>${rs?"Confirmar: repor tudo":"Repor padrão"}</button></div></div></div>`;
}

function App(){
 const [c,setC]=useState(load);const [ok,setOk]=useState(()=>{try{const s=JSON.parse(localStorage.getItem(LKEY)),a=s&&c.accounts[s.u];return !!(a&&a.admin&&hs(a.pass)===s.h)}catch(e){return false}});const [tab,setTab]=useState("maps");
 useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}},[c]);
 const txt=JSON.stringify(c,null,2);const [g,setG]=useState(ghLoad);const [st,setSt]=useState({s:"idle",m:""});const last=useRef(txt);
 useEffect(()=>{try{localStorage.setItem(GK,JSON.stringify(g))}catch(e){}},[g]);
 const pull=async()=>{
  try{setSt({s:"run",m:"A carregar do site…"});const j=await ghGet(g);const n={...DEF,...j};last.current=JSON.stringify(n,null,2);setC(n);setSt({s:"ok",m:"Configuração carregada do site."})}
  catch(e){setSt({s:"err",m:e instanceof TypeError?"Sem ligação à internet ou bloqueada (abre o painel a partir do ficheiro).":e.message})}};
 const pub=async()=>{
  if(!g.owner.trim()||!g.repo.trim()||!g.token.trim()){setSt({s:"err",m:"Preenche utilizador, repositório e token."});return}
  setSt({s:"run",m:"A publicar…"});
  try{await ghPut(g,txt);last.current=txt;setSt({s:"ok",m:"Publicado às "+new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})+" · o site atualiza em ~1 min"})}
  catch(e){setSt({s:"err",m:e instanceof TypeError?"Sem ligação à internet ou bloqueada (abre o painel a partir do ficheiro).":e.message})}};
 useEffect(()=>{if(!g.auto||!ok||!g.owner||!g.repo||!g.token||txt===last.current)return;const t=setTimeout(pub,2500);return()=>clearTimeout(t)},[txt,JSON.stringify(g),ok]);
 if(!ok)return html`<${Gate} accts=${c.accounts} onOk=${()=>setOk(true)}/>`;
 const T=[["maps","Mapas"],["accts","Contas e Roster"],["menu","Menu e Site"],["links","Ligações e Anúncio"],["pub","Publicar"]];
 const B={maps:Maps,accts:Accts,menu:MenuTab,links:Links,pub:Publish}[tab];
 return html`<div class="max-w-4xl mx-auto p-4 sm:p-6 space-y-4">
  <header class="glass flex flex-wrap items-center gap-3 px-4 py-3" style=${{borderRadius:26}}><${Logo}/><b>FWT Admin</b>${st.s!=="idle"&&html`<span class="text-xs order-last w-full sm:order-none sm:w-auto sm:ml-2" style=${{color:st.s==="err"?"#f87171":"var(--g)"}}>${st.m}</span>`}${st.s==="idle"&&!(g.owner&&g.token)&&html`<button class="text-xs order-last w-full sm:order-none sm:w-auto sm:ml-2" style=${{color:"#F5A524"}} onClick=${()=>setTab("pub")}>Não ligado ao GitHub</button>`}<button class="ghost tap ml-auto" onClick=${()=>{try{localStorage.removeItem(LKEY)}catch(e){}setOk(false)}}><${I} n="out"/> Sair</button></header>
  <nav class="glass nav flex gap-1 p-1.5" style=${{borderRadius:22}}>${T.map(([id,l])=>html`<button key=${id} onClick=${()=>setTab(id)} class="tap px-4 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap" style=${{background:tab===id?"var(--g)":"transparent",color:tab===id?"#0d1a04":"var(--tx)"}}>${l}</button>`)}</nav>
  <${B} c=${c} setC=${setC} gh=${{g,setG,st,pub,pull}}/></div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script></body></html>
